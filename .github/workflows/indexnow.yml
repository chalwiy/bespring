name: SEO sitemap and IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  seo-maintenance:
    runs-on: ubuntu-latest
    env:
      SITE_HOST: www.bespringchem.com
      SITE_ORIGIN: https://www.bespringchem.com
      INDEXNOW_KEY: 425a4655a3dc49f59e4e5bcfebc27999
      INDEXNOW_KEY_LOCATION: https://www.bespringchem.com/425a4655a3dc49f59e4e5bcfebc27999.txt

    steps:
      - name: Checkout site
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate sitemap.xml
        run: python3 .github/scripts/seo_automation.py sitemap

      - name: Commit sitemap when changed
        id: sitemap
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- sitemap.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sitemap.xml is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Update sitemap automatically [skip ci]"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages after sitemap update
        if: steps.sitemap.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          success=false
          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /tmp/pages-response.json -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")

            if [ "$code" = "201" ] || [ "$code" = "202" ]; then
              echo "Requested a GitHub Pages rebuild for the updated sitemap."
              success=true
              break
            fi

            if [ "$code" = "409" ]; then
              echo "A Pages build is already running; retrying..."
              sleep 15
              continue
            fi

            echo "GitHub Pages rebuild request failed with HTTP $code"
            cat /tmp/pages-response.json || true
            exit 1
          done

          if [ "$success" != "true" ]; then
            echo "Could not request a Pages rebuild after retries."
            exit 1
          fi

      - name: Build changed URL list
        shell: bash
        run: |
          set -euo pipefail
          : > indexnow-files.txt

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git ls-files '*.html' > indexnow-files.txt
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"

            if [ -z "$BEFORE" ] || printf '%s' "$BEFORE" | grep -Eq '^0+$'; then
              git ls-files '*.html' > indexnow-files.txt
            else
              git diff --name-only --no-renames --diff-filter=ACMDR "$BEFORE" "$AFTER" -- '*.html' > indexnow-files.txt || true

              # Validate the IndexNow filter over the whole current site when
              # this workflow or its helper script changes.
              if [ ! -s indexnow-files.txt ] && git diff --name-only "$BEFORE" "$AFTER" | grep -Eq '^\.github/(workflows/indexnow\.yml|scripts/seo_automation\.py)$'; then
                git ls-files '*.html' > indexnow-files.txt
              fi
            fi
          fi

          sort -u indexnow-files.txt -o indexnow-files.txt
          echo "HTML files selected for IndexNow:"
          cat indexnow-files.txt || true

      - name: Submit indexable URLs to IndexNow
        run: python3 .github/scripts/seo_automation.py indexnow indexnow-files.txt
